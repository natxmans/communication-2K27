<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Signalétique — Gaming Toussaint 2026</title>
<style>
  @page { size: A4 landscape; margin: 0; }
  *{ box-sizing: border-box; margin: 0; padding: 0; }
  html, body{ background: #fff; }
  body{ font-family: "Segoe UI", Arial, Helvetica, sans-serif; color: #111; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .page{ width: 297mm; height: 210mm; position: relative; overflow: hidden; page-break-after: always; break-after: page; background: #fff; }
  .page:last-child{ page-break-after: auto; break-after: auto; }

  /* ---------- panneau d'un espace ---------- */
  .panneau{ display: grid; grid-template-columns: 34mm 1fr; }
  .bande{ background: var(--c); display: flex; flex-direction: column; align-items: center; padding-top: 14mm; gap: 6mm; }
  .num{ width: 20mm; height: 20mm; border-radius: 50%; background: #fff; color: var(--c); font-size: 26pt; font-weight: 900; display: flex; align-items: center; justify-content: center; }
  .num.long{ font-size: 17pt; }
  .contenu{ padding: 14mm 16mm 12mm 16mm; display: flex; flex-direction: column; height: 210mm; position: relative; }
  .titre{ font-size: var(--t, 70pt); font-weight: 900; line-height: .98; text-transform: uppercase; letter-spacing: -1px; max-width: 170mm; margin-top: 4mm; }
  .sous{ font-size: 22pt; font-weight: 600; color: #333; margin-top: 6mm; max-width: 175mm; line-height: 1.2; }
  .puce{ display: inline-block; margin-top: 6mm; margin-right: 5mm; padding: 3mm 7mm; border-radius: 40px; font-size: 20pt; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; background: #111; color: #fff; }
  .puce.jour{ background: var(--c); }
  .bas{ margin-top: auto; display: flex; align-items: flex-end; justify-content: space-between; gap: 10mm; }
  .pied{ font-size: 12pt; color: #555; line-height: 1.35; }
  .pied b{ color: #111; }
  .miniplan{ width: 98mm; border: 1.5px solid #bbb; border-radius: 4mm; overflow: hidden; background: #fff; }
  .miniplan svg{ width: 100%; height: auto; display: block; }
  .miniplan .leg{ font-size: 10pt; padding: 1.5mm 4mm; background: #f2f2f2; color: #444; }

  .pegi{ position: absolute; top: 14mm; right: 16mm; width: 44mm; text-align: center; }
  .pegi .carre{ border-radius: 5mm; padding: 3mm 0 4mm; background: var(--p); color: #111; border: 2.5px solid #111; }
  .pegi .carre .lab{ font-size: 15pt; font-weight: 900; letter-spacing: 3px; }
  .pegi .carre .val{ font-size: 54pt; font-weight: 900; line-height: 1; }
  .pegi .carre .plus{ font-size: 28pt; font-weight: 900; }
  .pegi .note{ font-size: 10pt; color: #444; margin-top: 2mm; font-weight: 600; }

  .avec-fleche .titre, .avec-fleche .sous{ max-width: 150mm; }
  .fleche{ position: absolute; top: 14mm; right: 16mm; width: 62mm; }
  .fleche svg{ width: 100%; height: auto; display: block; }

  /* ---------- page 1 : plan des panneaux ---------- */
  .vue{ padding: 10mm 14mm; display: grid; grid-template-columns: 1fr 78mm; gap: 5mm 8mm; height: 210mm; }
  .vue h1{ font-size: 22pt; font-weight: 900; text-transform: uppercase; grid-column: 1 / -1; }
  .vue h1 small{ font-size: 11pt; font-weight: 600; text-transform: none; color: #555; display: block; margin-top: 1mm; letter-spacing: 0; }
  .vue .grand{ border: 1.5px solid #bbb; border-radius: 3mm; overflow: hidden; align-self: start; }
  .vue .grand svg{ display: block; width: 100%; height: auto; }
  .legende{ list-style: none; font-size: 9pt; line-height: 1.2; align-self: start; }
  .legende li{ display: flex; gap: 2.5mm; align-items: center; padding: .6mm 0; border-bottom: 1px solid #eee; }
  .legende .pastille{ flex: 0 0 5.5mm; height: 5.5mm; border-radius: 50%; background: var(--c); color: #fff; font-weight: 900; font-size: 8pt; display: flex; align-items: center; justify-content: center; }
  .legende .pastille.l{ border-radius: 3mm; flex-basis: 10mm; }
  .legende b{ font-weight: 800; }
  .legende i{ color: #666; font-style: normal; }
  .vue .astuce{ grid-column: 1 / -1; font-size: 9.5pt; color: #444; background: #f6f6f6; padding: 2.5mm 4mm; border-radius: 2mm; align-self: end; }

  /* ---------- page des flèches ---------- */
  .fleches{ padding: 12mm 14mm; height: 210mm; }
  .fleches h1{ font-size: 22pt; font-weight: 900; text-transform: uppercase; }
  .fleches p.sub{ font-size: 11pt; color: #555; margin: 1mm 0 6mm; }
  .grille-f{ display: grid; grid-template-columns: 1fr 1fr; gap: 8mm; }
  .case-f{ border: 2px dashed #999; border-radius: 4mm; height: 80mm; display: flex; align-items: center; justify-content: center; }
  .case-f svg{ height: 62mm; width: auto; }
</style>
</head>
<body>
<div id="racine"></div>

<script>
  // [x, y, largeur, hauteur] dans le repère du plan (1169 x 826) — mêmes positions que le site.
  var ESPACES = [
    { n: '1',  titre: 'FIFA · PS4',            sous: 'Football sur PS4, projeté sur le mur',                        pegi: 3,  rect: [190,58,155,90],   c: '#0f8a8a', t: '86pt' },
    { n: '2',  titre: 'Mario Kart 1',          sous: 'Switch SAJ 1 · sélections le matin, tournoi découverte l\'après-midi', pegi: 3, rect: [350,58,118,90], c: '#d2452b', t: '78pt' },
    { n: '3',  titre: 'Mario Kart 2',          sous: 'Deuxième poste du tournoi Mario Kart',                        pegi: 3,  rect: [318,186,102,108], c: '#d2452b', t: '78pt' },
    { n: '4',  titre: 'Brawl Stars',           sous: 'Espace détente : poufs et smartphones',                       pegi: 7,  rect: [470,58,88,90],    c: '#c98a12', t: '82pt' },
    { n: '5',  titre: 'Scène · Just Dance',    sous: 'Mot du Maire, Kahoot géant, finales des tournois, goûter',    pegi: 3,  rect: [612,58,190,90],   c: '#e0338a', t: '72pt' },
    { n: '6',  titre: 'Smash Bros',            sous: 'Super Smash Bros. Ultimate sur TV',                           pegi: 12, rect: [808,58,85,90],    c: '#2b7fd2', t: '86pt' },
    { n: '7',  titre: 'PC · LAN',              sous: 'Parties en réseau (Fortnite) · écran spectateur pour attendre', pegi: 12, rect: [750,186,143,152], c: '#7a45c9', t: '90pt' },
    { n: '8',  titre: 'PEGI 16',               sous: 'Espace Valorant · accès uniquement avec un badge PEGI 16',    pegi: 16, rect: [190,168,112,236], c: '#9b1c3a', t: '100pt', note: 'Un adulte vérifie les badges à l\'entrée' },
    { n: '9',  titre: 'Stand Léognan',         sous: 'Gang Beasts · Boomerang Fu (Switch apportée par la Maison des Jeunes de Léognan)', pegi: null, rect: [495,186,66,108], c: '#c98a12', t: '78pt' },
    { n: '10', titre: 'Jeux coop',             sous: 'Jeux coopératifs sur TV 2 · stand du SAJ',                    pegi: null, rect: [566,186,66,108], c: '#2b7fd2', t: '86pt', jour: 'Mardi uniquement' },
    { n: '11', titre: 'Société',               sous: 'Jeux de société calmes · stand du SAJ',                       pegi: null, rect: [637,186,66,108], c: '#5f6b7a', t: '90pt', jour: 'Mardi uniquement' },
    { n: '12', titre: 'ABCS',                  sous: 'Stand de l\'association ABCS (Blanquefort) · PS5 et Switch',              pegi: null, rect: [566,186,66,108], c: '#2b7fd2', t: '86pt', jour: 'Mercredi uniquement' },
    { n: '13', titre: 'Rétro Mios',            sous: 'Bornes d\'arcade fabriquées par les jeunes de l\'Espace Jeunes de Mios', pegi: null, rect: [637,186,66,108], c: '#c2407f', t: '62pt', jour: 'Mercredi uniquement' },
    { n: '14', titre: 'Espace repas',          sous: 'Pique-nique apporté par chaque jeune · 2 services : 12h30 et 13h30', pegi: null, rect: [750,380,143,158], c: '#5f6b7a', t: '58pt', note: '9 tables · 54 places' },
    { n: '15', titre: 'Accueil',               sous: 'Pointage, badge PEGI et règles de la journée',                pegi: null, rect: [662,428,44,110],  c: '#1f9a6b', t: '100pt' },
    { n: '16', titre: 'Dépôt',                 sous: 'Dépose tes affaires (sac, veste) dans les bacs',              pegi: null, rect: [662,318,44,100],  c: '#5f6b7a', t: '110pt' },
    { n: '17', titre: 'Entrée',                sous: 'Bienvenue à Gaming Toussaint 2026 · on entre par le préau',   pegi: null, rect: [700,548,60,52],   c: '#1f8a5b', t: '92pt', fleche: 'haut', pt: [728,574] },
    { n: '18', titre: 'Cinéma',                sous: 'Niveau −1 : sortir par le préau, entrer dans la cage d\'escalier et descendre', pegi: null, rect: [440,520,80,80], c: '#123a8a', t: '92pt', fleche: 'bas', pt: [480,560], note: 'Départ groupé : un adulte devant, un derrière' }
  ];
  var PEGI_COULEUR = { 3: '#8ee07f', 7: '#8ee07f', 12: '#f6b24a', 16: '#f6b24a' };
  var PLAN = 'plan-halle-original.png';

  function el(html){ var d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstChild; }
  function centre(e){ return e.pt || [e.rect[0] + e.rect[2] / 2, e.rect[1] + e.rect[3] / 2]; }

  function svgArrow(dir, color){
    var rot = { haut: 0, droite: 90, bas: 180, gauche: 270 }[dir];
    return '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><g transform="rotate(' + rot + ' 50 50)">' +
      '<path d="M50 6 L92 52 H66 V94 H34 V52 H8 Z" fill="' + color + '" stroke="#111" stroke-width="3" stroke-linejoin="round"/></g></svg>';
  }

  function miniPlan(e){
    var c = centre(e);
    var r = e.rect;
    return '<div class="miniplan"><svg viewBox="150 20 800 620" xmlns="http://www.w3.org/2000/svg">' +
      '<image href="' + PLAN + '" x="0" y="0" width="1169" height="826"/>' +
      '<rect x="' + r[0] + '" y="' + r[1] + '" width="' + r[2] + '" height="' + r[3] + '" rx="4" fill="' + e.c + '" fill-opacity=".45" stroke="' + e.c + '" stroke-width="6"/>' +
      '<circle cx="' + c[0] + '" cy="' + c[1] + '" r="26" fill="#fff" stroke="' + e.c + '" stroke-width="6"/>' +
      '<text x="' + c[0] + '" y="' + (c[1] + 10) + '" text-anchor="middle" font-size="' + (e.n.length > 1 ? 26 : 30) + '" font-weight="900" fill="#111" font-family="Segoe UI, Arial, sans-serif">' + e.n + '</text>' +
      '</svg><div class="leg">Emplacement sur le plan de la Halle · entrée par le préau (en bas)</div></div>';
  }

  function panneau(e){
    var p = e.pegi ? '<div class="pegi" style="--p:' + PEGI_COULEUR[e.pegi] + '"><div class="carre"><div class="lab">PEGI</div><div class="val">' + e.pegi + '<span class="plus">+</span></div></div>' +
      (e.note && e.pegi === 16 ? '<div class="note">' + e.note + '</div>' : '') + '</div>' : '';
    var f = e.fleche ? '<div class="fleche">' + svgArrow(e.fleche, e.c) + '</div>' : '';
    var chips = '';
    if (e.jour) chips += '<span class="puce jour">' + e.jour + '</span>';
    if (e.note && e.pegi !== 16) chips += '<span class="puce">' + e.note + '</span>';
    return el('<section class="page panneau' + (e.fleche ? ' avec-fleche' : '') + '" style="--c:' + e.c + '">' +
      '<div class="bande"><div class="num' + (e.n.length > 1 ? '' : '') + '">' + e.n + '</div></div>' +
      '<div class="contenu">' + p + f +
        '<h2 class="titre" style="--t:' + e.t + '">' + e.titre + '</h2>' +
        '<div class="sous">' + e.sous + '</div>' +
        '<div>' + chips + '</div>' +
        '<div class="bas"><div class="pied"><b>Gaming Toussaint 2026</b><br>Halle du Centre Culturel · Cestas<br>20 et 21 octobre</div>' + miniPlan(e) + '</div>' +
      '</div></section>');
  }

  function vuePlan(){
    var marks = '';
    // marqueurs : les jours Mardi / Mercredi partageant la même place sont regroupés
    var groupes = { '10': '10 · 12', '11': '11 · 13' };
    ESPACES.forEach(function(e){
      if (e.n === '12' || e.n === '13') return;
      var c = centre(e), lab = groupes[e.n] || e.n;
      var w = lab.length > 2 ? 54 : 30;
      marks += '<g><rect x="' + (c[0] - w/2) + '" y="' + (c[1] - 15) + '" width="' + w + '" height="30" rx="15" fill="' + e.c + '" stroke="#fff" stroke-width="3"/>' +
        '<text x="' + c[0] + '" y="' + (c[1] + 8) + '" text-anchor="middle" font-size="21" font-weight="900" fill="#fff" font-family="Segoe UI, Arial, sans-serif">' + lab + '</text></g>';
    });
    var li = ESPACES.map(function(e){
      var lab = e.n;
      var jour = e.jour ? ' <i>(' + e.jour.replace(' uniquement', '').toLowerCase() + ')</i>' : '';
      return '<li style="--c:' + e.c + '"><span class="pastille' + (lab.length > 2 ? ' l' : '') + '">' + lab + '</span><span><b>' + e.titre + '</b>' + jour + '</span></li>';
    }).join('');
    return el('<section class="page vue"><h1>Signalétique — où poser quoi<small>Gaming Toussaint 2026 · Halle du Centre Culturel de Cestas · un panneau A4 par numéro (pages suivantes)</small></h1>' +
      '<div class="grand"><svg viewBox="0 0 1169 826" xmlns="http://www.w3.org/2000/svg"><image href="' + PLAN + '" x="0" y="0" width="1169" height="826"/>' +
        '<path d="M728,610 V548" stroke="#1f8a5b" stroke-width="7" fill="none"/>' + marks + '</svg></div>' +
      '<ul class="legende">' + li + '</ul>' +
      '<div class="astuce"><b>À valider sur place :</b> positions d\'après le plan de travail du SAJ (24/09), à ajuster lors de la visite de la Halle. Les numéros 10 à 13 occupent les deux mêmes emplacements : 10 et 11 le mardi, 12 et 13 le mercredi — on remplace les panneaux le soir du mardi.</div></section>');
  }

  function pageFleches(){
    var cases = ['haut', 'bas', 'gauche', 'droite'].map(function(d){ return '<div class="case-f">' + svgArrow(d, '#111') + '</div>'; }).join('');
    return el('<section class="page fleches"><h1>Flèches de direction</h1><p class="sub">À découper et à coller aux endroits où on peut se tromper (couloirs, bas de l\'escalier du cinéma, sortie du préau).</p><div class="grille-f">' + cases + '</div></section>');
  }

  var racine = document.getElementById('racine');
  racine.appendChild(vuePlan());
  ESPACES.forEach(function(e){ racine.appendChild(panneau(e)); });
  racine.appendChild(pageFleches());
</script>
</body>
</html>
